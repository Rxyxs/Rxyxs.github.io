<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#6E7781"/></marker></defs><rect width="1280" height="920" fill="#FFFFFF"/><text x="40.0" y="62.0" font-size="26" font-weight="700" fill="#1F2328" text-anchor="start">Buses Vule S.A. · Supply and fuel</text><text x="40.0" y="92.0" font-size="15.5" font-weight="400" fill="#6E7781" text-anchor="start">Data Analyst · Santiago&#x27;s public bus network (Red) · January 2025 to April 2026</text><rect x="40.0" y="122" width="228.8" height="78" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/><text x="58.0" y="162.0" font-size="26" font-weight="700" fill="#1F2328" text-anchor="start">20</text><text x="58.0" y="185.0" font-size="13" font-weight="400" fill="#6E7781" text-anchor="start">depots</text><rect x="282.8" y="122" width="228.8" height="78" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/><text x="300.8" y="162.0" font-size="26" font-weight="700" fill="#1F2328" text-anchor="start">2,094</text><text x="300.8" y="185.0" font-size="13" font-weight="400" fill="#6E7781" text-anchor="start">buses in the app</text><rect x="525.6" y="122" width="228.8" height="78" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/><text x="543.6" y="162.0" font-size="26" font-weight="700" fill="#1A7F37" text-anchor="start">−70%</text><text x="543.6" y="185.0" font-size="13" font-weight="400" fill="#6E7781" text-anchor="start">processing time</text><rect x="768.4" y="122" width="228.8" height="78" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/><text x="786.4" y="162.0" font-size="26" font-weight="700" fill="#1F2328" text-anchor="start">1,754</text><text x="786.4" y="185.0" font-size="13" font-weight="400" fill="#6E7781" text-anchor="start">real loads in the test</text><rect x="1011.2" y="122" width="228.8" height="78" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/><text x="1029.2" y="162.0" font-size="26" font-weight="700" fill="#1F2328" text-anchor="start">13</text><text x="1029.2" y="185.0" font-size="13" font-weight="400" fill="#6E7781" text-anchor="start">automated tests</text><rect x="40.0" y="232" width="219.2" height="432" rx="14" fill="#fff" stroke="#D0D7DE" stroke-width="1.4"/><text x="58.0" y="266.0" font-size="11" font-weight="700" fill="#1A7F37" text-anchor="start" letter-spacing="1.3">01  CAPTURE</text><rect x="67.0" y="284" width="22" height="38" rx="4" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M74.0 289h8M72.0 297h12M72.0 303h12M72.0 309h8" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="78.0" cy="317" r="1.5" fill="#1A7F37"/><text x="58.0" y="354.0" font-size="15.5" font-weight="700" fill="#1F2328" text-anchor="start">AppSheet app</text><circle cx="62.0" cy="379.5" r="2.4" fill="#6E7781"/><text x="71.0" y="384.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">Replaced the Excel sheets</text><text x="71.0" y="402.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">and paper</text><circle cx="62.0" cy="423.5" r="2.4" fill="#6E7781"/><text x="71.0" y="428.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">Bus and van forms with</text><text x="71.0" y="446.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">conditional logic</text><circle cx="62.0" cy="467.5" r="2.4" fill="#6E7781"/><text x="71.0" y="472.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">Per-shift readings: pumps,</text><text x="71.0" y="490.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">AdBlue and stock</text><circle cx="62.0" cy="511.5" r="2.4" fill="#6E7781"/><text x="71.0" y="516.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">Validations on a relational</text><text x="71.0" y="534.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">model</text><line x1="58.0" y1="572" x2="241.2" y2="572" stroke="#D0D7DE"/><text x="58.0" y="594.0" font-size="10.5" font-weight="700" fill="#6E7781" text-anchor="start" letter-spacing="1.2">OUTPUT</text><rect x="58.0" y="606" width="106" height="23" rx="11.5" fill="#EEF8F0" stroke="#9BD3AB"/><text x="110.8" y="622.0" font-size="11.5" font-weight="600" fill="#1A7F37" text-anchor="middle">Mobile and web</text><rect x="58.0" y="635" width="106" height="23" rx="11.5" fill="#EEF8F0" stroke="#9BD3AB"/><text x="110.8" y="651.0" font-size="11.5" font-weight="600" fill="#1A7F37" text-anchor="middle">Automatic KPIs</text><line x1="262.2" y1="448.0" x2="280.2" y2="448.0" stroke="#6E7781" stroke-width="2" marker-end="url(#a)"/><rect x="285.2" y="232" width="219.2" height="432" rx="14" fill="#fff" stroke="#D0D7DE" stroke-width="1.4"/><text x="303.2" y="266.0" font-size="11" font-weight="700" fill="#1A7F37" text-anchor="start" letter-spacing="1.3">02  INTEGRATION</text><path d="M303.2 290h40l-15 16v12l-10 5v-17z" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M310.2 284v2M323.2 282v4M336.2 284v2" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="303.2" y="354.0" font-size="15.5" font-weight="700" fill="#1F2328" text-anchor="start">Python ETL</text><circle cx="307.2" cy="379.5" r="2.4" fill="#6E7781"/><text x="316.2" y="384.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">Consolidates the sheets by</text><text x="316.2" y="402.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">depot, day and month</text><circle cx="307.2" cy="423.5" r="2.4" fill="#6E7781"/><text x="316.2" y="428.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">Cleans hand-typed times,</text><text x="316.2" y="446.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">plates and dates</text><circle cx="307.2" cy="467.5" r="2.4" fill="#6E7781"/><text x="316.2" y="472.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">Automates weekly inventory</text><text x="316.2" y="490.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">reconciliations and</text><text x="316.2" y="508.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">purchase reports</text><line x1="303.2" y1="572" x2="486.4" y2="572" stroke="#D0D7DE"/><text x="303.2" y="594.0" font-size="10.5" font-weight="700" fill="#6E7781" text-anchor="start" letter-spacing="1.2">OUTPUT</text><rect x="303.2" y="606" width="54" height="23" rx="11.5" fill="#EEF8F0" stroke="#9BD3AB"/><text x="330.4" y="622.0" font-size="11.5" font-weight="600" fill="#1A7F37" text-anchor="middle">pandas</text><rect x="363.6" y="606" width="48" height="23" rx="11.5" fill="#EEF8F0" stroke="#9BD3AB"/><text x="387.6" y="622.0" font-size="11.5" font-weight="600" fill="#1A7F37" text-anchor="middle">regex</text><rect x="303.2" y="635" width="74" height="23" rx="11.5" fill="#EEF8F0" stroke="#9BD3AB"/><text x="340.0" y="651.0" font-size="11.5" font-weight="600" fill="#1A7F37" text-anchor="middle">−70% time</text><line x1="507.4" y1="448.0" x2="525.4" y2="448.0" stroke="#6E7781" stroke-width="2" marker-end="url(#a)"/><rect x="530.4" y="232" width="219.2" height="432" rx="14" fill="#fff" stroke="#D0D7DE" stroke-width="1.4"/><text x="548.4" y="266.0" font-size="11" font-weight="700" fill="#1A7F37" text-anchor="start" letter-spacing="1.3">03  CONTROL</text><path d="M551.4 318a17 17 0 1 1 34 0" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M568.4 318l8-11" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="568.4" cy="318" r="3" fill="#1A7F37"/><text x="548.4" y="354.0" font-size="15.5" font-weight="700" fill="#1F2328" text-anchor="start">Efficiency and tanks</text><circle cx="552.4" cy="379.5" r="2.4" fill="#6E7781"/><text x="561.4" y="384.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">Each bus&#x27;s km/L against its</text><text x="561.4" y="402.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">previous load, even at</text><text x="561.4" y="420.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">another depot</text><circle cx="552.4" cy="441.5" r="2.4" fill="#6E7781"/><text x="561.4" y="446.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">Flags BR or CI by its model</text><text x="561.4" y="464.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">and standard&#x27;s range</text><circle cx="552.4" cy="485.5" r="2.4" fill="#6E7781"/><text x="561.4" y="490.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">Theoretical stock against</text><text x="561.4" y="508.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">the measured stock per tank</text><line x1="548.4" y1="572" x2="731.5999999999999" y2="572" stroke="#D0D7DE"/><text x="548.4" y="594.0" font-size="10.5" font-weight="700" fill="#6E7781" text-anchor="start" letter-spacing="1.2">OUTPUT</text><rect x="548.4" y="606" width="48" height="23" rx="11.5" fill="#EEF8F0" stroke="#9BD3AB"/><text x="572.4" y="622.0" font-size="11.5" font-weight="600" fill="#1A7F37" text-anchor="middle">KMACC</text><rect x="602.4" y="606" width="35" height="23" rx="11.5" fill="#EEF8F0" stroke="#9BD3AB"/><text x="620.0" y="622.0" font-size="11.5" font-weight="600" fill="#1A7F37" text-anchor="middle">REV</text><rect x="548.4" y="635" width="125" height="23" rx="11.5" fill="#EEF8F0" stroke="#9BD3AB"/><text x="610.8" y="651.0" font-size="11.5" font-weight="600" fill="#1A7F37" text-anchor="middle">Theoretical stock</text><line x1="752.6" y1="448.0" x2="770.6" y2="448.0" stroke="#6E7781" stroke-width="2" marker-end="url(#a)"/><rect x="775.6" y="232" width="219.2" height="432" rx="14" fill="#fff" stroke="#D0D7DE" stroke-width="1.4"/><text x="793.6" y="266.0" font-size="11" font-weight="700" fill="#1A7F37" text-anchor="start" letter-spacing="1.3">04  ANALYTICS</text><path d="M795.5999999999999 320h36M795.5999999999999 286v34" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M799.5999999999999 312l9-9 7 6 13-15" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="815.5999999999999" cy="309" r="2.4" fill="#fff" stroke="#CF222E" stroke-width="2"/><text x="793.6" y="354.0" font-size="15.5" font-weight="700" fill="#1F2328" text-anchor="start">Anomalies and forecast</text><circle cx="797.5999999999999" cy="379.5" r="2.4" fill="#6E7781"/><text x="806.6" y="384.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">Anomaly detection: fuel</text><text x="806.6" y="402.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">losses and deviations</text><circle cx="797.5999999999999" cy="423.5" r="2.4" fill="#6E7781"/><text x="806.6" y="428.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">Demand forecast to supply</text><text x="806.6" y="446.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">critical inputs</text><line x1="793.5999999999999" y1="572" x2="976.8" y2="572" stroke="#D0D7DE"/><text x="793.6" y="594.0" font-size="10.5" font-weight="700" fill="#6E7781" text-anchor="start" letter-spacing="1.2">OUTPUT</text><rect x="793.6" y="606" width="74" height="23" rx="11.5" fill="#EEF8F0" stroke="#9BD3AB"/><text x="830.4" y="622.0" font-size="11.5" font-weight="600" fill="#1A7F37" text-anchor="middle">Anomalies</text><rect x="873.2" y="606" width="67" height="23" rx="11.5" fill="#EEF8F0" stroke="#9BD3AB"/><text x="906.8" y="622.0" font-size="11.5" font-weight="600" fill="#1A7F37" text-anchor="middle">Forecast</text><line x1="997.8" y1="448.0" x2="1015.8" y2="448.0" stroke="#6E7781" stroke-width="2" marker-end="url(#a)"/><rect x="1020.8" y="232" width="219.2" height="432" rx="14" fill="#fff" stroke="#D0D7DE" stroke-width="1.4"/><text x="1038.8" y="266.0" font-size="11" font-weight="700" fill="#1A7F37" text-anchor="start" letter-spacing="1.3">05  REPORTING</text><rect x="1038.8" y="286" width="40" height="32" rx="4" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1046.8 310v-6M1054.8 310v-12M1062.8 310v-9M1070.8 310v-15" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1038.8" y="354.0" font-size="15.5" font-weight="700" fill="#1F2328" text-anchor="start">Power BI and ERP</text><circle cx="1042.8" cy="379.5" r="2.4" fill="#6E7781"/><text x="1051.8" y="384.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">Executive dashboards of</text><text x="1051.8" y="402.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">fleet indicators</text><circle cx="1042.8" cy="423.5" r="2.4" fill="#6E7781"/><text x="1051.8" y="428.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">Excel with live formulas</text><text x="1051.8" y="446.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">and range colours</text><circle cx="1042.8" cy="467.5" r="2.4" fill="#6E7781"/><text x="1051.8" y="472.0" font-size="13" font-weight="400" fill="#3D444D" text-anchor="start">Sync with the Softland ERP</text><line x1="1038.8" y1="572" x2="1222.0" y2="572" stroke="#D0D7DE"/><text x="1038.8" y="594.0" font-size="10.5" font-weight="700" fill="#6E7781" text-anchor="start" letter-spacing="1.2">OUTPUT</text><rect x="1038.8" y="606" width="67" height="23" rx="11.5" fill="#EEF8F0" stroke="#9BD3AB"/><text x="1072.4" y="622.0" font-size="11.5" font-weight="600" fill="#1A7F37" text-anchor="middle">Power BI</text><rect x="1112.0" y="606" width="67" height="23" rx="11.5" fill="#EEF8F0" stroke="#9BD3AB"/><text x="1145.6" y="622.0" font-size="11.5" font-weight="600" fill="#1A7F37" text-anchor="middle">Softland</text><rect x="40" y="694" width="1200" height="174" rx="14" fill="#FFFBEA" stroke="#EAD39C"/><path d="M40 710v142" stroke="#BF8700" stroke-width="5" stroke-linecap="round"/><text x="68.0" y="730.0" font-size="15.5" font-weight="700" fill="#1F2328" text-anchor="start">Data problems found and fixed</text><circle cx="79.0" cy="760" r="11" fill="#fff" stroke="#BF8700" stroke-width="1.6"/><text x="79.0" y="764.5" font-size="12" font-weight="700" fill="#9A6700" text-anchor="middle">1</text><text x="100.0" y="764.0" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">Dates sorted as text: across months, km were</text><text x="100.0" y="782.0" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">computed against the wrong reading</text><circle cx="460.3" cy="760" r="11" fill="#fff" stroke="#BF8700" stroke-width="1.6"/><text x="460.3" y="764.5" font-size="12" font-weight="700" fill="#9A6700" text-anchor="middle">2</text><text x="481.3" y="764.0" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">The standard written two ways (Euro V / EURO V)</text><text x="481.3" y="782.0" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">left buses with no range and no alert</text><circle cx="841.7" cy="760" r="11" fill="#fff" stroke="#BF8700" stroke-width="1.6"/><text x="841.7" y="764.5" font-size="12" font-weight="700" fill="#9A6700" text-anchor="middle">3</text><text x="862.7" y="764.0" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">Every bus&#x27;s first load was flagged as below range</text><circle cx="79.0" cy="820" r="11" fill="#fff" stroke="#BF8700" stroke-width="1.6"/><text x="79.0" y="824.5" font-size="12" font-weight="700" fill="#9A6700" text-anchor="middle">4</text><text x="100.0" y="824.0" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">The app picked another shift&#x27;s opening reading;</text><text x="100.0" y="842.0" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">now matched by folio, depot and date</text><circle cx="460.3" cy="820" r="11" fill="#fff" stroke="#BF8700" stroke-width="1.6"/><text x="460.3" y="824.5" font-size="12" font-weight="700" fill="#9A6700" text-anchor="middle">5</text><text x="481.3" y="824.0" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">A sheet with a mistyped month produced 28 negative</text><text x="481.3" y="842.0" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">mileages</text><text x="40.0" y="898.0" font-size="12.5" font-weight="400" fill="#6E7781" text-anchor="start">The bus-fleet-fuel-efficiency repository reproduces the consolidation, efficiency and tank control on fictitious data.</text></svg>
