<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 684" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9z" fill="#6E7781"/></marker></defs><rect width="1200" height="684" fill="#FFFFFF"/><text x="40" y="64" font-size="26" font-weight="700" fill="#1F2328" text-anchor="start">Fuel control for a bus fleet</text><text x="40" y="94" font-size="15.5" font-weight="400" fill="#6E7781" text-anchor="start">From 17 separate spreadsheets to one consolidated base and an app for field records</text><rect x="40" y="128" width="252" height="344" rx="14" fill="#fff" stroke="#D0D7DE" stroke-width="1.4"/><text x="62" y="166" font-size="11.5" font-weight="700" fill="#1A7F37" text-anchor="start" letter-spacing="1.4">01  SOURCE</text><rect x="70" y="184" width="30" height="36" rx="3" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/><rect x="64" y="190" width="30" height="36" rx="3" fill="#fff" stroke="#1A7F37" stroke-width="2"/><path d="M64 202h30M64 214h30M76 190v36" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="260" font-size="17.5" font-weight="700" fill="#1F2328" text-anchor="start">17 Excel sheets</text><circle cx="66" cy="285.5" r="2.6" fill="#6E7781"/><text x="76" y="290" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">One sheet per depot</text><circle cx="66" cy="311.5" r="2.6" fill="#6E7781"/><text x="76" y="316" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">Each depot recorded its loads</text><text x="76" y="335" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">separately</text><line x1="62" y1="372" x2="270" y2="372" stroke="#D0D7DE"/><text x="62" y="394" font-size="11" font-weight="700" fill="#6E7781" text-anchor="start" letter-spacing="1.2">OUTPUT</text><rect x="62" y="406" width="77" height="24" rx="12" fill="#EEF8F0" stroke="#9BD3AB"/><text x="100.7" y="422.5" font-size="12" font-weight="600" fill="#1A7F37" text-anchor="middle">17 depots</text><line x1="298" y1="300.0" x2="324" y2="300.0" stroke="#6E7781" stroke-width="2" marker-end="url(#a)"/><rect x="332" y="128" width="252" height="344" rx="14" fill="#fff" stroke="#D0D7DE" stroke-width="1.4"/><text x="354" y="166" font-size="11.5" font-weight="700" fill="#1A7F37" text-anchor="start" letter-spacing="1.4">02  INTEGRATION</text><path d="M354 190h44l-16 18v14l-12 6v-20z" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M362 184v2M376 182v4M390 184v2" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="354" y="260" font-size="17.5" font-weight="700" fill="#1F2328" text-anchor="start">Consolidation in Python</text><circle cx="358" cy="285.5" r="2.6" fill="#6E7781"/><text x="368" y="290" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">Merges the 17 sheets into one</text><text x="368" y="309" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">base</text><circle cx="358" cy="330.5" r="2.6" fill="#6E7781"/><text x="368" y="335" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">Compresses the records and</text><text x="368" y="354" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">consolidates them</text><line x1="354" y1="372" x2="562" y2="372" stroke="#D0D7DE"/><text x="354" y="394" font-size="11" font-weight="700" fill="#6E7781" text-anchor="start" letter-spacing="1.2">OUTPUT</text><rect x="354" y="406" width="71" height="24" rx="12" fill="#EEF8F0" stroke="#9BD3AB"/><text x="389.4" y="422.5" font-size="12" font-weight="600" fill="#1A7F37" text-anchor="middle">By depot</text><rect x="430.8" y="406" width="58" height="24" rx="12" fill="#EEF8F0" stroke="#9BD3AB"/><text x="459.6" y="422.5" font-size="12" font-weight="600" fill="#1A7F37" text-anchor="middle">By day</text><rect x="354" y="436" width="71" height="24" rx="12" fill="#EEF8F0" stroke="#9BD3AB"/><text x="389.4" y="452.5" font-size="12" font-weight="600" fill="#1A7F37" text-anchor="middle">By month</text><line x1="590" y1="300.0" x2="616" y2="300.0" stroke="#6E7781" stroke-width="2" marker-end="url(#a)"/><rect x="624" y="128" width="252" height="344" rx="14" fill="#fff" stroke="#D0D7DE" stroke-width="1.4"/><text x="646" y="166" font-size="11.5" font-weight="700" fill="#1A7F37" text-anchor="start" letter-spacing="1.4">03  VALIDATION</text><path d="M650 216a18 18 0 1 1 36 0" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M668 216l9-12" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="668" cy="216" r="3" fill="#1A7F37"/><text x="646" y="260" font-size="17.5" font-weight="700" fill="#1F2328" text-anchor="start">Efficiency check</text><circle cx="650" cy="285.5" r="2.6" fill="#6E7781"/><text x="660" y="290" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">Each bus&#x27;s km/L against its</text><text x="660" y="309" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">previous load</text><circle cx="650" cy="330.5" r="2.6" fill="#6E7781"/><text x="660" y="335" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">Flags loads outside its model&#x27;s</text><text x="660" y="354" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">range</text><line x1="646" y1="372" x2="854" y2="372" stroke="#D0D7DE"/><text x="646" y="394" font-size="11" font-weight="700" fill="#6E7781" text-anchor="start" letter-spacing="1.2">OUTPUT</text><rect x="646" y="406" width="44" height="24" rx="12" fill="#EEF8F0" stroke="#9BD3AB"/><text x="668.2" y="422.5" font-size="12" font-weight="600" fill="#1A7F37" text-anchor="middle">km/L</text><rect x="696.4" y="406" width="117" height="24" rx="12" fill="#EEF8F0" stroke="#9BD3AB"/><text x="754.9" y="422.5" font-size="12" font-weight="600" fill="#1A7F37" text-anchor="middle">Range per model</text><line x1="882" y1="300.0" x2="908" y2="300.0" stroke="#6E7781" stroke-width="2" marker-end="url(#a)"/><rect x="916" y="128" width="252" height="344" rx="14" fill="#fff" stroke="#1A7F37" stroke-width="2"/><text x="938" y="166" font-size="11.5" font-weight="700" fill="#1A7F37" text-anchor="start" letter-spacing="1.4">04  OPERATION</text><rect x="948" y="184" width="24" height="42" rx="4" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M956 189h8M953 198h14M953 205h14M953 212h9" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="960" cy="220" r="1.6" fill="#1A7F37"/><text x="938" y="260" font-size="17.5" font-weight="700" fill="#1F2328" text-anchor="start">AppSheet app</text><circle cx="942" cy="285.5" r="2.6" fill="#6E7781"/><text x="952" y="290" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">Operators record loads, pumps</text><text x="952" y="309" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">and tanks from their phone</text><circle cx="942" cy="330.5" r="2.6" fill="#6E7781"/><text x="952" y="335" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start">Replaced the spreadsheets</text><line x1="938" y1="372" x2="1146" y2="372" stroke="#D0D7DE"/><text x="938" y="394" font-size="11" font-weight="700" fill="#6E7781" text-anchor="start" letter-spacing="1.2">OUTPUT</text><rect x="938" y="406" width="150" height="24" rx="12" fill="#EEF8F0" stroke="#9BD3AB"/><text x="1013.0" y="422.5" font-size="12" font-weight="600" fill="#1A7F37" text-anchor="middle">Per-pump consumption</text><rect x="938" y="436" width="130" height="24" rx="12" fill="#EEF8F0" stroke="#9BD3AB"/><text x="1003.1" y="452.5" font-size="12" font-weight="600" fill="#1A7F37" text-anchor="middle">Theoretical stock</text><rect x="1074.2" y="436" width="58" height="24" rx="12" fill="#EEF8F0" stroke="#9BD3AB"/><text x="1103.0" y="452.5" font-size="12" font-weight="600" fill="#1A7F37" text-anchor="middle">AdBlue</text><rect x="40" y="504" width="1120" height="118" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><path d="M40 518v90" stroke="#BF8700" stroke-width="5" stroke-linecap="round"/><text x="68" y="538" font-size="15.5" font-weight="700" fill="#1F2328" text-anchor="start">Quality control: bugs fixed while reviewing the code</text><circle cx="80.0" cy="570" r="12" fill="#fff" stroke="#BF8700" stroke-width="1.6"/><text x="80.0" y="574.5" font-size="12.5" font-weight="700" fill="#9A6700" text-anchor="middle">1</text><text x="102.0" y="575" font-size="14" font-weight="400" fill="#3D444D" text-anchor="start">Dates sorted wrongly across months</text><circle cx="434.6666666666667" cy="570" r="12" fill="#fff" stroke="#BF8700" stroke-width="1.6"/><text x="434.6666666666667" y="574.5" font-size="12.5" font-weight="700" fill="#9A6700" text-anchor="middle">2</text><text x="456.6666666666667" y="575" font-size="14" font-weight="400" fill="#3D444D" text-anchor="start">Buses left without a range by how</text><text x="456.6666666666667" y="594" font-size="14" font-weight="400" fill="#3D444D" text-anchor="start">the standard was written</text><circle cx="789.3333333333334" cy="570" r="12" fill="#fff" stroke="#BF8700" stroke-width="1.6"/><text x="789.3333333333334" y="574.5" font-size="12.5" font-weight="700" fill="#9A6700" text-anchor="middle">3</text><text x="811.3333333333334" y="575" font-size="14" font-weight="400" fill="#3D444D" text-anchor="start">Every bus&#x27;s first load flagged by</text><text x="811.3333333333334" y="594" font-size="14" font-weight="400" fill="#3D444D" text-anchor="start">mistake</text><text x="40" y="658" font-size="12.5" font-weight="400" fill="#6E7781" text-anchor="start">Process diagram. The repository uses fictitious example data.</text></svg>
